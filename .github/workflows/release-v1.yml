name: Publish versioned Home Assistant Bridge release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'sdk/**'
      - 'tests/**'
      - '.github/workflows/release-v1.yml'
permissions:
  contents: write
concurrency:
  group: home-assistant-bridge-versioned-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate plugin and shared audio SDK
        run: |
          node -e "const p=require('./package.json');if(!p.version.startsWith('1.0.')||p.pebble.projectType!=='plugin')process.exit(1)"
          node --check src/plugin/index.js
          node --check sdk/ha_audio.js
          node tests/test_plugin.cjs
          node tests/test_audio_sdk.cjs
          cc -std=c11 -fsyntax-only -DPBL_SPEAKER -Isdk/tests -Isdk sdk/ha_audio.c
          cc -std=c11 -fsyntax-only -Isdk/tests -Isdk sdk/ha_audio.c
      - name: Package plugin-only PBW
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/coredevices/pebble-apps/ff7f6c5bd5c1aafce3cf8626aa143eb5599130f2/scripts/pack-plugin-pbw.py \
            --output /tmp/pack-plugin-pbw.py
          python3 /tmp/pack-plugin-pbw.py .
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('build/pebble-home-assistant-plugin.pbw') as z:
              info=json.loads(z.read('appinfo.json'))
              assert info['versionLabel']==json.loads(open('package.json').read())['version']
              assert info['projectType']=='plugin' if 'projectType' in info else info['manifestVersion']==2
              assert info['plugin']['script'] in z.namelist()
          PY
          VERSION=$(node -p "require('./package.json').version")
          cp build/pebble-home-assistant-plugin.pbw "home-assistant-bridge-v${VERSION}.pbw"
      - uses: actions/upload-artifact@v4
        with:
          name: home-assistant-bridge-release
          path: home-assistant-bridge-v*.pbw
          if-no-files-found: error
      - name: Publish immutable versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ASSET="home-assistant-bridge-${TAG}.pbw"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $TAG is already published. Refusing to overwrite a stable release." >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Home Assistant Bridge ${VERSION}" \
            --notes "Stable Home Assistant Bridge update. Version ${VERSION} adds optional local-network HTTP access, restricted to private IPv4 or .local hosts. HTTPS stays the default. Plain HTTP transmits Home Assistant tokens and data unencrypted." \
            --latest
          echo "Stable PBW: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET" >> "$GITHUB_STEP_SUMMARY"
