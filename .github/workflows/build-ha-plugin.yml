name: Build Home Assistant Plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/build-ha-plugin.yml'
permissions:
  contents: write
concurrency:
  group: ha-plugin-direct-download
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate plugin JavaScript and manifest
        run: |
          node --check src/plugin/index.js
          node tests/test_plugin.cjs
      - name: Package Pebble plugin-only PBW
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/coredevices/pebble-apps/ff7f6c5bd5c1aafce3cf8626aa143eb5599130f2/scripts/pack-plugin-pbw.py \
            --output /tmp/pack-plugin-pbw.py
          python3 /tmp/pack-plugin-pbw.py .
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('build/pebble-home-assistant-plugin.pbw') as z:
              info=json.loads(z.read('appinfo.json'))
              assert info['manifestVersion']==2
              assert info['plugin']['script'] in z.namelist()
              assert info['configPage'] in z.namelist()
              print('Packaged plugin',info['uuid'],info['versionLabel'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: home-assistant-plugin-${{ github.sha }}
          path: build/*.pbw
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable development PBW
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Action artifacts are always ZIP archives. A GitHub Release asset
          # preserves the .pbw extension and downloads directly to the phone.
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest \
              --target "$GITHUB_SHA" \
              --title "Latest development build (not a stable release)" \
              --notes "Automatically updated from successful main-branch builds. Install only for testing. The downloadable PBW is a Pebble package, not a ZIP to extract." \
              --prerelease
          fi
          gh release upload dev-latest build/pebble-home-assistant-plugin.pbw --clobber
          echo "### Direct PBW download" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Home Assistant Bridge .pbw](https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/pebble-home-assistant-plugin.pbw)" >> "$GITHUB_STEP_SUMMARY"
